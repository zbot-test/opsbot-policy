# The test org's central policy: examples/policy-dryrun/policy.yaml with dependency_bump live,
# so a vulnerability finding opens its change in a sandbox repo. testenv/github_reset.py
# installs it in opsbot-policy.
version: "1"
action_kinds:
  block_ip:
    max_level: L3
    ephemeral: true
    mode: dryrun
  rollback:
    max_level: L2
    ephemeral: false
    mode: dryrun
  merge:
    max_level: L2
    ephemeral: false
    mode: dryrun
  revoke_credentials:
    max_level: L2
    ephemeral: true
    mode: dryrun
fix_types:
  dependency_bump:
    merge_level: L2
    mode: live
approvers: [ops-team]
